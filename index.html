<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aether X</title><link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css"></head><body>
<header class="pill" id="top"><div class="brand"><img src="/logo.png" alt="" onerror="this.style.display='none'"><b>Aether X</b></div>
<div class="hr"><a id="dc" class="rb" target="_blank" rel="noopener" hidden title="Discord"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></a>
<button id="theme" class="rb" title="Toggle theme"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button>
<button id="acc" class="rb" title="Account"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 4-7 8-7s8 2 8 7"/></svg></button></div></header>
<main>
<section id="v-chat" class="view on"><div id="ann" hidden></div><div class="onl"><i></i><span id="onl">0</span> online</div>
<div id="msgs"></div><div id="bar" hidden><span id="bart"></span><button id="barx">✕</button></div>
<div class="comp"><button id="att" class="rb" title="Attach"><svg viewBox="0 0 24 24"><path d="M21 12l-8.5 8.5a5 5 0 0 1-7-7L14 5a3.5 3.5 0 0 1 5 5l-8.5 8.5a2 2 0 0 1-3-3L15 7"/></svg></button><input id="inp" maxlength="300" placeholder="Write a message…" autocomplete="off"><button id="send" class="grad">Send</button></div><input type="file" id="fin" hidden></section>
<section id="v-loader" class="view"><div class="hero"><h2>Script Loader</h2><p>Turn your code into a link you can run anywhere.</p></div>
<div class="card"><div class="steps"><div class="st on" id="s1"><i>1</i>Write</div><u></u><div class="st" id="s2"><i>2</i>Generate</div><u></u><div class="st" id="s3"><i>3</i>Protected</div></div>
<input id="lname" placeholder="Script name"><textarea id="lcode" rows="9" placeholder="Paste your code here" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
<button id="gen" class="grad wide">Generate loader</button><pre id="out" hidden></pre></div>
<h3>Your loaders</h3><div id="mine"></div></section>
<section id="v-dev" class="view"><div class="hero"><h2>Developer Panel</h2><p>Only visible to you.</p></div>
<div class="card stats"><div><b id="sOn">0</b>online</div><div><b id="sLd">0</b>loaders</div></div>
<div class="card"><label>Discord link</label><input id="dcin" placeholder="https://discord.gg/…"><button id="dcsave" class="grad wide">Save link</button></div>
<div class="card"><label>Announcement (pinned in chat)</label><input id="anin" maxlength="200" placeholder="Leave empty to hide"><button id="ansave" class="grad wide">Publish</button></div>
<div class="card"><label>Main Script Loader (/loader)</label><textarea id="mcode" rows="9" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
<div class="two"><button id="msave" class="grad">Save</button><button id="mcopy" class="ghost">Copy loadstring</button></div></div>
<div class="card"><label>Danger zone</label><button id="clear" class="ghost wide danger">Clear recent chat</button></div></section>
</main>
<nav class="pill" id="nav"><button data-v="chat" class="on"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg><span>Chat</span></button>
<button data-v="loader"><svg viewBox="0 0 24 24"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/></svg><span>Loader</span></button></nav>
<div id="modal" hidden><div class="card"><div id="mout" hidden><div class="me"><div class="av pav" id="pav"></div><small>Tap photo to change</small><b id="who"></b></div><input id="dnin" maxlength="24" placeholder="Display name"><button id="dnsave" class="ghost wide">Save name</button>
<button id="devbtn" class="grad wide" hidden>Developer panel</button><button id="logout" class="ghost wide">Log out</button></div>
<div id="min"><h3>Welcome to Aether X</h3><input id="au" placeholder="Username" autocapitalize="off" autocorrect="off"><input id="ap" type="password" placeholder="Password (min 6)">
<div class="two"><button id="login" class="grad">Log in</button><button id="reg" class="ghost">Sign up</button></div></div><button id="mx" class="link">Close</button></div></div>
<div id="lb" hidden><img alt=""></div><input type="file" id="avin" accept="image/*" hidden><div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="/app.js"></script></body></html>
