<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Echo</title><link rel="icon" href="/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css"></head><body>
<header class="pill" id="top">
<div class="brand"><b>Echo</b></div>
<button id="theme" class="rb" title="Toggle theme"><svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5z"/></svg></button>
</header>
<main>
<div class="hero"><h2>Protect Link</h2><p>Save a script and get a permanent loadstring link.</p></div>
<div class="card">
<div class="steps"><div class="st on" id="s1"><i>1</i>Write</div><u></u><div class="st" id="s2"><i>2</i>Generate</div><u></u><div class="st" id="s3"><i>3</i>Protected</div></div>
<input id="lname" placeholder="Script name">
<button id="imp" class="ghost wide">Upload file</button>
<textarea id="lcode" rows="10" placeholder="Paste your code here" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
<button id="gen" class="grad wide">Generate loader</button>
<pre id="out" hidden></pre>
<div id="outact" hidden class="two"><button id="outcopy" class="ghost">Copy</button><button id="outdl" class="ghost">Download</button></div>
</div>
<h3>Your links</h3>
<input id="lq" placeholder="Search your links">
<div id="mine"></div>
</main>
<input type="file" id="fimp" accept=".lua,.txt,text/plain" hidden>
<div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="/app.js"></script></body></html>
