<!DOCTYPE html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aether X</title><link rel="icon" href="/logo.png"><link rel="stylesheet" href="/style.css"></head><body>
<header class="pill" id="top"><div class="brand"><img src="/logo.png" alt="" onerror="this.style.display='none'"><b>Aether X</b></div>
<div class="hr"><a id="dc" class="rb" target="_blank" rel="noopener" hidden title="Discord"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></a>
<button id="acc" class="rb" title="Akun"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-5 4-7 8-7s8 2 8 7"/></svg></button></div></header>
<main>
<section id="v-chat" class="view on"><div class="onl"><i></i><span id="onl">0</span> online</div><div id="msgs"></div>
<div id="bar" hidden><span id="bart"></span><button id="barx">✕</button></div>
<div class="comp"><input id="inp" maxlength="300" placeholder="Tulis pesan…" autocomplete="off"><button id="send" class="grad">Kirim</button></div></section>
<section id="v-loader" class="view"><div class="card"><div class="steps"><div class="st on" id="s1"><i>1</i>Write</div><u></u><div class="st" id="s2"><i>2</i>Generate</div><u></u><div class="st" id="s3"><i>3</i>Protected</div></div>
<input id="lname" placeholder="Nama script"><textarea id="lcode" rows="9" placeholder="Tempel kode di sini" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
<button id="gen" class="grad wide">Generate loader</button><pre id="out" hidden></pre></div>
<h3>Your loaders</h3><div id="mine"></div></section>
<section id="v-dev" class="view"><div class="card stats"><div><b id="sOn">0</b>online</div><div><b id="sLd">0</b>loader</div></div>
<div class="card"><label>Link Discord</label><input id="dcin" placeholder="https://discord.gg/…"><button id="dcsave" class="grad wide">Simpan link</button></div>
<div class="card"><label>Main Script Loader (/loader)</label><textarea id="mcode" rows="9" autocorrect="off" autocapitalize="off" spellcheck="false"></textarea>
<div class="two"><button id="msave" class="grad">Save</button><button id="mcopy" class="ghost">Copy loadstring</button></div></div></section>
</main>
<nav class="pill" id="nav"><button data-v="chat" class="on"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/></svg></button>
<button data-v="loader"><svg viewBox="0 0 24 24"><path d="M9 7l-5 5 5 5M15 7l5 5-5 5"/></svg></button>
<button data-v="dev" id="navdev" hidden><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/></svg></button></nav>
<div id="modal" hidden><div class="card"><div id="mout" hidden><p id="who"></p><button id="logout" class="ghost wide">Keluar</button></div>
<div id="min"><input id="au" placeholder="Username" autocapitalize="off" autocorrect="off"><input id="ap" type="password" placeholder="Password (min 6)">
<div class="two"><button id="login" class="grad">Masuk</button><button id="reg" class="ghost">Daftar</button></div></div><button id="mx" class="link">Tutup</button></div></div>
<div id="toast"></div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="/app.js"></script></body></html>
